<div class="page-title">
  <h1>Pontos de Coleta</h1>
  <p>Encontre locais próximos para descartar seus resíduos eletrônicos.</p>
</div>

<section class="search-box">
  <input type="text" placeholder="Buscar ponto de coleta..." />
  <button>Buscar</button>
</section>
<section class="grid-2">
  <article class="card ponto-card"   *ngFor="let ponto of (pontos$ | async) ?? []">
    <div class="icon">📍</div>

    <div>
      <h2>{{ ponto.nome }}</h2>
      <p><strong>Endereço:</strong> {{ ponto.endereco }}</p>
      <p><strong>Horário:</strong> {{ ponto.horario }}</p>
      <p><strong>Telefone:</strong> {{ ponto.telefone }}</p>

      <div class="tags">
        @for (item of ponto.residuos; track item) {
          <span>{{ item }}</span>
        }
      </div>
    </div>
  </article>
</section>
