<div class="page-title">
  <h1>Solicitar Coleta</h1>
  <p>Preencha os dados abaixo para agendar sua coleta.</p>
</div>

<div class="solicitar-container">

  <form
    class="card formulario"
    [formGroup]="formulario"
    (ngSubmit)="salvar()">

    <div class="campo">
      <label for="residuo">Tipo de resíduo</label>

      <select id="residuo" formControlName="residuo">
        <option value="">Selecione o tipo de resíduo</option>

        <option *ngFor="let residuo of residuos()" [value]="residuo.nome" >{{residuo.nome}}</option>
      </select>
    </div>

    <div class="campo">
      <label for="quantidade">Quantidade</label>

      <input
        id="quantidade"
        type="number"
        min="1"
        formControlName="quantidade">
    </div>

    <div class="campo">
      <label for="logradouro">Logradouro</label>

      <input
        id="logradouro"
        type="text"
        placeholder="Rua, Avenida, Praça..."
        formControlName="logradouro">
    </div>

    <div class="grid-2">

      <div class="campo">
        <label for="numero">Número</label>

        <input
          id="numero"
          type="text"
          placeholder="123"
          formControlName="numero">
      </div>

      <div class="campo">
        <label for="bairro">Bairro</label>

        <input
          id="bairro"
          type="text"
          placeholder="Centro"
          formControlName="bairro">
      </div>

    </div>

    <div class="campo">
      <label for="cidade">Cidade</label>

      <input
        id="cidade"
        type="text"
        formControlName="cidade">
    </div>

    <div class="grid-2">

      <div class="campo">
        <label for="data">Data desejada</label>

        <input
          id="data"
          type="date"
          formControlName="data">
      </div>

      <div class="campo">
        <label for="periodo">Período</label>

        <select id="periodo" formControlName="periodo">
          <option value="Manhã">Manhã</option>
          <option value="Tarde">Tarde</option>
          <option value="Noite">Noite</option>
        </select>
      </div>

    </div>

    <div class="acoes">
  <button
    type="button"
    class="btn-secondary"
    routerLink="/dashboard">

    Cancelar

  </button>

  <button
    type="submit"
    class="btn-primary">

    Agendar Coleta

  </button>
</div>

</form>

<div class="card ajuda">

  <h2>Como funciona?</h2>

  <div class="passo">
    <div>
      <h4>Preencha os dados</h4>
      <p>Informe o tipo de resíduo e o endereço da coleta.</p>
    </div>
  </div>

  <div class="passo">
    <div>
      <h4>Aguardamos a confirmação</h4>
      <p>Nossa equipe irá validar o agendamento.</p>
    </div>
  </div>

  <div class="passo">
    <div>
      <h4>Realizamos a coleta</h4>
      <p>Buscamos os resíduos no local informado.</p>
    </div>
  </div>

</div>

</div>
