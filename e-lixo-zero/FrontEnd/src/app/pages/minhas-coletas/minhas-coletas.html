<div class="page-title">
  <h1>Minhas Coletas</h1>
  <p>Acompanhe o status das suas solicitações.</p>
</div>

<div class="lista">

  <div class="card coleta-card" *ngFor="let coleta of (coletas$ | async) ?? []">

    <div class="info">

      <h3>{{ coleta.residuo }}</h3>

      <p>
        {{ coleta.logradouro }},
        {{ coleta.numero }}
      </p>

      <p>
        {{ coleta.bairro }} -
        {{ coleta.cidade }}
      </p>

      <p>
        {{ coleta.data }} •
        {{ coleta.periodo }}
      </p>

    </div>

    <div
      class="status"
      [ngClass]="{
        'agendada': coleta.status === 'Agendada',
        'andamento': coleta.status === 'Em Andamento',
        'concluida': coleta.status === 'Concluída'
      }">

      {{ coleta.status }}

    </div>

  </div>

</div>
