<div class="page-title">
  <h1>Tipos de Resíduos</h1>

  <p>
    Saiba como descartar cada tipo de resíduo corretamente.
  </p>
</div>

<div class="grid-residuos">

  <div class="card residuo-card" *ngFor="let residuo of residuos()">

    <div class="icone">
      {{ obterIcone(residuo.nome) }}
    </div>

    <h3>{{ residuo.nome }}</h3>

    <span class="categoria">
      {{ residuo.categoria }}
    </span>

    <p>
      {{ residuo.descricao }}
    </p>

  </div>

</div>

<div class="card ajuda">

  <h2>Dúvidas?</h2>

  <p>
    Consulte os pontos de coleta mais próximos ou entre em contato com nossa equipe.
  </p>

</div>
