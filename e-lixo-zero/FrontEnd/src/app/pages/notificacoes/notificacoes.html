<div class="page-title">
  <h1>Notificações</h1>
  <p>Acompanhe atualizações sobre suas coletas.</p>
</div>

<div class="lista">
  <div class="card notificacao" *ngFor="let notificacao of (notificacoes$ | async) ?? []">
    <div class="icone">🔔</div>

    <div class="conteudo">
      <h3>{{ notificacao.titulo }}</h3>
      <p>{{ notificacao.mensagem }}</p>
      <span>{{ notificacao.data }}</span>
    </div>
  </div>
</div>
